{{define "content"}}
<h2>📩 新的岗位投递</h2>
<p>您好，{{.RecipientName}}！</p>
<p>有一位候选人投递了 <strong>{{.JobTitle}}</strong> 岗位，请及时查阅。</p>

<div class="info-box">
  <div class="label">投递岗位</div>
  <div class="value">{{.JobTitle}}</div>
</div>

<p>{{.Content}}</p>

{{if .ActionURL}}<a href="{{.ActionURL}}" class="btn">查看简历</a>{{end}}
<p>请尽快查看候选人简历并进行筛选。</p>
{{end}}
