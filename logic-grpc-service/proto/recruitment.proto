// ══════════════════════════════════════════════════════════════════════
// Phase 6: Analytics & AI Audit
// ══════════════════════════════════════════════════════════════════════

// ── Auth Audit Logs ───────────────────────────────────────────────────

message QueryAuthAuditLogsRequest {
  int64 actor_user_id = 1;    // optional filter
  string permission_key = 2;  // optional filter
  string decision = 3;        // optional filter: allowed / denied
  int32 page = 4;
  int32 page_size = 5;
}

message AuthAuditLogItem {
  uint64 id = 1;
  int64 actor_user_id = 2;
  string actor_roles = 3;
  string permission_key = 4;
  string resource_type = 5;
  uint64 resource_id = 6;
  string decision = 7;
  string reason = 8;
  string request_id = 9;
  string client_ip = 10;
  string created_at = 11;
}

message QueryAuthAuditLogsResponse {
  int32 code = 1;
  string msg = 2;
  int64 total = 3;
  repeated AuthAuditLogItem list = 4;
}

// ── Dashboard Report ─────────────────────────────────────────────────

message GetDashboardReportRequest {
  int64 staff_user_id = 1;
}

message DashboardReportItem {
  string stage_key = 1;
  string stage_label = 2;
  int64 count = 3;
}

message DashboardTrendPoint {
  string date = 1;
  int64 applications = 2;
}

message GetDashboardReportResponse {
  int32 code = 1;
  string msg = 2;

  // KPI
  int64 online_jobs = 3;
  int64 offline_jobs = 4;
  int64 total_applications = 5;
  int64 today_applications = 6;
  int64 unread_notifications = 7;
  int64 pending_actions = 8;

  // Trend (last 7 days)
  repeated DashboardTrendPoint trend = 9;

  // Stage distribution (funnel)
  repeated DashboardReportItem stage_distribution = 10;
}

// ── Funnel Report ────────────────────────────────────────────────────

message GetFunnelReportRequest {
  int64 staff_user_id = 1;
  string start_date = 2;  // RFC 3339, optional
  string end_date = 3;    // RFC 3339, optional
  int64 job_id = 4;       // optional filter
}

message FunnelStage {
  string stage_key = 1;
  string stage_label = 2;
  int64 count = 3;
  double conversion_rate = 4; // rate from previous stage (0-100)
}

message GetFunnelReportResponse {
  int32 code = 1;
  string msg = 2;
  repeated FunnelStage stages = 3;
}

// ── Time-in-Stage Report ─────────────────────────────────────────────

message GetTimeInStageReportRequest {
  int64 staff_user_id = 1;
  string start_date = 2;  // RFC 3339, optional
  string end_date = 3;    // RFC 3339, optional
  int64 job_id = 4;       // optional filter
}

message StageDuration {
  string stage_key = 1;
  string stage_label = 2;
  double avg_hours = 3;    // average hours spent in this stage
  int64 transition_count = 4;
}

message GetTimeInStageReportResponse {
  int32 code = 1;
  string msg = 2;
  repeated StageDuration durations = 3;
}

// ── Interview & Offer Metrics ────────────────────────────────────────

message GetInterviewOfferMetricsRequest {
  int64 staff_user_id = 1;
  string start_date = 2;  // RFC 3339, optional
  string end_date = 3;    // RFC 3339, optional
  int64 job_id = 4;       // optional filter
}

message GetInterviewOfferMetricsResponse {
  int32 code = 1;
  string msg = 2;

  // Interview metrics
  int64 total_interviews = 3;
  int64 completed_interviews = 4;
  int64 positive_feedbacks = 5;
  double pass_rate = 6;  // 0-100

  // Offer metrics
  int64 total_offers = 7;
  int64 accepted_offers = 8;
  int64 rejected_offers = 9;
  double acceptance_rate = 10; // 0-100
}

// ══════════════════════════════════════════════════════════════════════
// P1-003: AI Usage Statistics & Trend
// ══════════════════════════════════════════════════════════════════════

message GetUsageStatsRequest {
  string start_time = 1;   // RFC 3339
  string end_time = 2;     // RFC 3339
  string dimension = 3;    // user / model / session
}

message UsageStatsItem {
  string name = 1;                // dimension value: user_id, model name, or session_id
  int64 total_tokens = 2;         // total estimated tokens
  int64 call_count = 3;           // total call count
  double avg_cost_ms = 4;         // average cost in milliseconds
  double estimated_cost = 5;      // estimated cost in USD
}

message GetUsageStatsResponse {
  int32 code = 1;
  string msg = 2;
  repeated UsageStatsItem list = 3;
}

message GetUsageTrendRequest {
  string start_time = 1;   // RFC 3339
  string end_time = 2;     // RFC 3339
  string granularity = 3;  // day / week / month
}

message UsageTrendPoint {
  string date = 1;                // date label (e.g. "2026-06-01")
  int64 total_tokens = 2;         // total estimated tokens
  int64 call_count = 3;           // total call count
  double avg_cost_ms = 4;         // average cost in milliseconds
  double estimated_cost = 5;      // estimated cost in USD
}

message GetUsageTrendResponse {
  int32 code = 1;
  string msg = 2;
  repeated UsageTrendPoint list = 3;
}

// ══════════════════════════════════════════════════════════════════════
// P1-006: MCP Tool Center
// ══════════════════════════════════════════════════════════════════════

service MCPService {
  rpc ListMCPServers(ListMCPServersRequest) returns (ListMCPServersResponse);
  rpc CreateMCPServer(CreateMCPServerRequest) returns (MCPServerResponse);
  rpc UpdateMCPServer(UpdateMCPServerRequest) returns (MCPServerResponse);
  rpc DeleteMCPServer(DeleteMCPServerRequest) returns (CommonResponse);
  rpc ListMCPToolPolicies(ListMCPToolPoliciesRequest) returns (ListMCPToolPoliciesResponse);
  rpc CreateMCPToolPolicy(CreateMCPToolPolicyRequest) returns (MCPToolPolicyResponse);
  rpc UpdateMCPToolPolicy(UpdateMCPToolPolicyRequest) returns (MCPToolPolicyResponse);
  rpc DeleteMCPToolPolicy(DeleteMCPToolPolicyRequest) returns (CommonResponse);
  rpc ListMCPToolLogs(ListMCPToolLogsRequest) returns (ListMCPToolLogsResponse);
  rpc TestMCPConnection(TestMCPConnectionRequest) returns (TestMCPConnectionResponse);
  rpc ListMCPTools(ListMCPToolsRequest) returns (ListMCPToolsResponse);
  rpc CallMCPTool(CallMCPToolRequest) returns (CallMCPToolResponse);
}

message MCPServerInfo {
  int64 id = 1;
  string name = 2;
  string description = 11;        // Human-readable server description
  string transport = 3;           // stdio / sse / http
  string command_or_url = 4;
  string args = 5;                // JSON array string
  string env_vars = 6;            // JSON object string
  int32 timeout_seconds = 7;
  bool is_enabled = 8;
  string status = 12;             // connected / disconnected / error
  int32 tool_count = 13;          // Number of tools discovered
  string last_error = 14;         // Last connection error message
  string created_at = 9;
  string updated_at = 10;
}

message ListMCPServersRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListMCPServersResponse {
  int32 code = 1;
  string msg = 2;
  int64 total = 3;
  repeated MCPServerInfo list = 4;
}

message CreateMCPServerRequest {
  string name = 1;
  string description = 7;         // Human-readable server description
  string transport = 2;
  string command_or_url = 3;
  string args = 4;                // JSON array string
  string env_vars = 5;            // JSON object string
  int32 timeout_seconds = 6;
}

message UpdateMCPServerRequest {
  int64 id = 1;
  string name = 2;                // Empty = no update
  string description = 11;        // Empty = no update
  string transport = 3;           // Empty = no update
  string command_or_url = 4;      // Empty = no update
  string args = 5;                // Empty = no update
  string env_vars = 6;            // Empty = no update
  int32 timeout_seconds = 7;
  bool timeout_seconds_set = 8;
  bool is_enabled = 9;
  bool is_enabled_set = 10;
}

message DeleteMCPServerRequest {
  int64 id = 1;
}

message MCPServerResponse {
  int32 code = 1;
  string msg = 2;
  MCPServerInfo server = 3;
}

message MCPToolPolicyInfo {
  int64 id = 1;
  int64 server_id = 2;
  string tool_name = 3;
  string effect = 4;                    // allow / deny
  string risk_level = 5;
  bool require_confirmation = 6;
  string allowed_roles_json = 7;         // JSON array string
  string allowed_scopes_json = 8;        // JSON array string
  string required_args_json = 9;         // JSON array string
  string denied_args_json = 10;          // JSON array string
  string arg_rules_json = 11;            // JSON object string
  string redact_fields_json = 12;        // JSON array string
  int32 rate_limit_window_seconds = 13;
  int32 rate_limit_max_calls = 14;
  bool is_enabled = 15;
  int64 created_by_hr_id = 16;
  int64 updated_by_hr_id = 17;
  string created_at = 18;
  string updated_at = 19;
}

message ListMCPToolPoliciesRequest {
  int64 server_id = 1;                   // 0 = all servers
  int32 page = 2;
  int32 page_size = 3;
}

message ListMCPToolPoliciesResponse {
  int32 code = 1;
  string msg = 2;
  int64 total = 3;
  repeated MCPToolPolicyInfo list = 4;
}

message CreateMCPToolPolicyRequest {
  int64 server_id = 1;
  string tool_name = 2;
  string effect = 3;
  string risk_level = 4;
  bool require_confirmation = 5;
  string allowed_roles_json = 6;
  string allowed_scopes_json = 7;
  string required_args_json = 8;
  string denied_args_json = 9;
  string arg_rules_json = 10;
  string redact_fields_json = 11;
  int32 rate_limit_window_seconds = 12;
  int32 rate_limit_max_calls = 13;
  bool is_enabled = 14;
  bool is_enabled_set = 15;
  int64 operator_hr_id = 16;
}

message UpdateMCPToolPolicyRequest {
  int64 id = 1;
  int64 server_id = 2;
  string tool_name = 3;
  string effect = 4;
  string risk_level = 5;
  bool require_confirmation = 6;
  bool require_confirmation_set = 7;
  string allowed_roles_json = 8;
  string allowed_scopes_json = 9;
  string required_args_json = 10;
  string denied_args_json = 11;
  string arg_rules_json = 12;
  string redact_fields_json = 13;
  int32 rate_limit_window_seconds = 14;
  bool rate_limit_window_seconds_set = 15;
  int32 rate_limit_max_calls = 16;
  bool rate_limit_max_calls_set = 17;
  bool is_enabled = 18;
  bool is_enabled_set = 19;
  int64 operator_hr_id = 20;
}

message DeleteMCPToolPolicyRequest {
  int64 id = 1;
}

message MCPToolPolicyResponse {
  int32 code = 1;
  string msg = 2;
  MCPToolPolicyInfo policy = 3;
}

message MCPToolLogInfo {
  int64 id = 1;
  int64 server_id = 2;
  string tool_name = 3;
  string args_json = 4;
  string result_content = 5;
  int32 duration_ms = 6;
  string error_msg = 7;
  int64 called_by_hr_id = 8;
  int64 session_id = 9;
  int64 policy_id = 10;
  string policy_decision = 11;
  string policy_reason = 12;
  string created_at = 13;
}

message ListMCPToolLogsRequest {
  int64 server_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListMCPToolLogsResponse {
  int32 code = 1;
  string msg = 2;
  int64 total = 3;
  repeated MCPToolLogInfo list = 4;
}

message TestMCPConnectionRequest {
  int64 server_id = 1;
}

message TestMCPConnectionResponse {
  int32 code = 1;
  string msg = 2;
  bool success = 3;
  string detail = 4;
}

message ListMCPToolsRequest {
  int64 server_id = 1;
}

message MCPToolInfo {
  string name = 1;
  string description = 2;
  string schema_json = 3;         // JSON Schema for the tool's input
}

message ListMCPToolsResponse {
  int32 code = 1;
  string msg = 2;
  repeated MCPToolInfo list = 3;
}

message CallMCPToolRequest {
  int64 server_id = 1;
  string tool_name = 2;
  string args_json = 3;           // Tool arguments as JSON
  int64 called_by_hr_id = 4;
  int64 session_id = 5;
  string caller_role = 6;
  string caller_scope = 7;
  bool confirmation_approved = 8;
}

message CallMCPToolResponse {
  int32 code = 1;
  string msg = 2;
  string result_content = 3;
  string error_msg = 4;           // Non-empty if tool execution failed but returned
  int64 duration_ms = 5;
  string policy_decision = 6;
  string policy_reason = 7;
  int64 policy_id = 8;
}

// ══════════════════════════════════════════════════════════════════════
// Phase M2: LLM Provider & Model Configuration
// ══════════════════════════════════════════════════════════════════════

service LlmConfigService {
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse);
  rpc CreateProvider(CreateProviderRequest) returns (ProviderResponse);
  rpc UpdateProvider(UpdateProviderRequest) returns (ProviderResponse);
  rpc DeleteProvider(DeleteProviderRequest) returns (CommonResponse);
  rpc TestProviderConnection(TestProviderConnectionRequest) returns (TestProviderConnectionResponse);

  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc CreateModel(CreateModelRequest) returns (ModelResponse);
  rpc UpdateModel(UpdateModelRequest) returns (ModelResponse);
  rpc DeleteModel(DeleteModelRequest) returns (CommonResponse);
}

// ── LLM Provider messages ───────────────────────────────────────────

message LlmProviderInfo {
  int64 id = 1;
  string name = 2;
  string base_url = 3;
  string api_key_masked = 4;       // 脱敏后的 key（前4+后4）
  string provider_type = 5;
  string extra_headers_json = 6;   // JSON 字符串，value 已脱敏
  bool is_enabled = 7;
  string created_at = 8;
  string updated_at = 9;
}

message ListProvidersRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListProvidersResponse {
  int32 code = 1;
  string msg = 2;
  int64 total = 3;
  repeated LlmProviderInfo list = 4;
}

message CreateProviderRequest {
  string name = 1;
  string base_url = 2;
  string api_key = 3;              // 明文传入，服务端加密存储
  string provider_type = 4;
  string extra_headers_json = 5;   // JSON string
}

message UpdateProviderRequest {
  int64 id = 1;
  string name = 2;                 // 空 = 不更新
  string base_url = 3;             // 空 = 不更新
  string api_key = 4;              // 空 = 不更新
  string provider_type = 5;        // 空 = 不更新
  string extra_headers_json = 6;   // 空 = 不更新，extra_headers_set=true 时显式清空
  bool is_enabled = 7;
  bool is_enabled_set = 8;         // 是否设置了 is_enabled
  bool extra_headers_set = 9;      // 是否显式设置了 extra_headers_json（支持清空）
}

message ProviderResponse {
  int32 code = 1;
  string msg = 2;
  LlmProviderInfo provider = 3;
}

message DeleteProviderRequest {
  int64 id = 1;
}

message TestProviderConnectionRequest {
  int64 provider_id = 1;
}

message TestProviderConnectionResponse {
  int32 code = 1;
  string msg = 2;
  bool success = 3;
  string detail = 4;               // 连接详情或错误信息
}

// ── LLM Model messages ─────────────────────────────────────────────

message LlmModelInfo {
  int64 id = 1;
  int64 provider_id = 2;
  string model_name = 3;
  string display_name = 4;
  double temperature = 5;
  double top_p = 6;
  int32 max_tokens = 7;
  int32 context_window_tokens = 15;
  int32 max_concurrency = 8;
  int32 timeout_seconds = 9;
  bool is_enabled = 10;
  bool is_default = 11;
  string created_at = 12;
  string updated_at = 13;
  string provider_name = 14;       // Joined field
}

message ListModelsRequest {
  int32 page = 1;
  int32 page_size = 2;
  int64 provider_id = 3;           // optional filter
}

message ListModelsResponse {
  int32 code = 1;
  string msg = 2;
  int64 total = 3;
  repeated LlmModelInfo list = 4;
}

message CreateModelRequest {
  int64 provider_id = 1;
  string model_name = 2;
  string display_name = 3;
  double temperature = 4;
  double top_p = 5;
  int32 max_tokens = 6;
  int32 context_window_tokens = 10;
  int32 max_concurrency = 7;
  int32 timeout_seconds = 8;
  bool is_default = 9;
}

message UpdateModelRequest {
  int64 id = 1;
  string model_name = 2;           // 空 = 不更新
  string display_name = 3;         // 空 = 不更新
  double temperature = 4;
  bool temperature_set = 5;        // 是否设置了 temperature
  double top_p = 6;
  bool top_p_set = 7;
  int32 max_tokens = 8;
  bool max_tokens_set = 9;
  int32 context_window_tokens = 18;
  bool context_window_tokens_set = 19;
  int32 max_concurrency = 10;
  bool max_concurrency_set = 11;
  int32 timeout_seconds = 12;
  bool timeout_seconds_set = 13;
  bool is_enabled = 14;
  bool is_enabled_set = 15;
  bool is_default = 16;
  bool is_default_set = 17;
}

message ModelResponse {
  int32 code = 1;
  string msg = 2;
  LlmModelInfo model = 3;
}

message DeleteModelRequest {
  int64 id = 1;
}

// ══════════════════════════════════════════════════════════════════════
// Phase M2: Prompt Template Management
// ══════════════════════════════════════════════════════════════════════

service PromptService {
  rpc ListPromptTemplates(ListPromptTemplatesRequest) returns (ListPromptTemplatesResponse);
  rpc CreatePromptTemplate(CreatePromptTemplateRequest) returns (PromptTemplateResponse);
  rpc UpdatePromptTemplate(UpdatePromptTemplateRequest) returns (PromptTemplateResponse);
  rpc DeletePromptTemplate(DeletePromptTemplateRequest) returns (CommonResponse);
  rpc GetPromptVersionHistory(GetPromptVersionHistoryRequest) returns (GetPromptVersionHistoryResponse);
  rpc RollbackPromptVersion(RollbackPromptVersionRequest) returns (PromptTemplateResponse);

  // Internal gRPC (not exposed via HTTP gateway)
  rpc RenderPrompt(RenderPromptRequest) returns (RenderPromptResponse);
  rpc GetActivePromptByAgentType(GetActivePromptByAgentTypeRequest) returns (GetActivePromptByAgentTypeResponse);
}

// ── Prompt Template messages ─────────────────────────────────────────

message PromptTemplateInfo {
  int64 id = 1;
  string name = 2;
  string content = 3;
  string variables_json = 4;     // JSON array string
  int32 version = 5;
  bool is_active = 6;
  string agent_type = 7;
  string prompt_role = 8;
  int64 created_by = 9;
  int64 updated_by = 10;
  string created_at = 11;
  string updated_at = 12;
}

message ListPromptTemplatesRequest {
  int32 page = 1;
  int32 page_size = 2;
