global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: smart-recruit-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - smart-recruit-gateway:8080
        labels:
          service: smart-recruit-gateway

  - job_name: smart-recruit-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - smart-recruit-identity-service:9091
          - smart-recruit-recruitment-service:9091
          - smart-recruit-ai-agent-service:9091
          - smart-recruit-billing-service:9099
        labels:
          service_group: smart-recruit-backend
