service:
  name: smart-recruit-gateway
  env: local
routeModes:
  identity: identity
  recruitment: recruitment
  interview: interview
  offer: offer
  notification: notification
  aiAgent: ai-agent
  analytics: analytics
timeouts:
  read: 10s
  write: 10s
localStaticDiscovery:
  staticDiscovery: true
readiness:
  includeEnabledRouteTargets: true
serviceTargets:
  identity:
    routeMode: identity
    grpcAddr: smart-recruit-identity-service:50061
  recruitment:
    routeMode: recruitment
    grpcAddr: smart-recruit-recruitment-service:50062
  interview:
    routeMode: interview
    grpcAddr: smart-recruit-interview-service:50063
  offer:
    routeMode: offer
    grpcAddr: smart-recruit-offer-service:50064
  notification:
    routeMode: notification
    grpcAddr: smart-recruit-notification-service:50065
  aiAgent:
    routeMode: ai-agent
    grpcAddr: smart-recruit-ai-agent-service:50066
  analytics:
    routeMode: analytics
    grpcAddr: smart-recruit-analytics-service:50067
  billing:
    routeMode: billing
    grpcAddr: smart-recruit-billing-service:50069
