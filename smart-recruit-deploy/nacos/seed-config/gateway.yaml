service:
  name: smart-recruit-gateway
  env: local
routeModes:
  identity: logic
  recruitment: logic
  interview: logic
  offer: logic
  notification: logic
  aiAgent: logic
  analytics: logic
timeouts:
  read: 10s
  write: 10s
fallback:
  staticDiscovery: true
readiness:
  includeEnabledRouteTargets: true
cutoverExamples:
  identity:
    routeMode: identity
    grpcAddr: smart-recruit-identity-service:50061
    rollbackRouteMode: logic
