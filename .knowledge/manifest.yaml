schema_version: 1

policies:
  default_review_days: 90
  allowed_statuses:
    - draft
    - active
    - stale
    - deprecated
    - archived
  direct_update_kinds:
    - runbook
    - pitfall
    - navigation
  approval_required_kinds:
    - decision
    - security
    - public-contract

