name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [dev, main]

jobs:
  schema-governance:
    name: Schema Governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify MySQL table ownership
        run: node scripts/check-mysql-table-ownership.mjs
      - name: Verify tenant data classification
        run: node scripts/check-tenant-classification.mjs
      - name: Verify UTC+8 timezone contract
        run: node scripts/check-timezone-contract.mjs
      - name: Verify immutable migration baseline
        run: node scripts/check-migration-baseline.mjs

  # ── Go Backend Tests ──────────────────────────────────────────────
  go-test:
    name: Go Tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - smart-recruit-proto
          - smart-recruit-platform-go
          - smart-recruit-commons
          - smart-recruit-gateway
          - smart-recruit-identity-service
          - smart-recruit-recruitment-service
          - smart-recruit-interview-service
          - smart-recruit-offer-service
          - smart-recruit-notification-service
          - smart-recruit-ai-agent-service
          - smart-recruit-analytics-service
          - smart-recruit-billing-service
          - smart-recruit-worker-service
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: recruitment_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache-dependency-path: |
            smart-recruit-*/go.sum
      - name: Go tests
        working-directory: ${{ matrix.module }}
        run: go test ./...
        env:
          MYSQL_DSN: root:test@tcp(127.0.0.1:3306)/recruitment_test?parseTime=true
          BILLING_TEST_MYSQL_DSN: root:test@tcp(127.0.0.1:3306)/recruitment_test?parseTime=true
          ALLOW_INSECURE_DEV_CONFIG: "true"
      - name: MySQL migration consistency test
        if: matrix.module == 'smart-recruit-commons'
        working-directory: smart-recruit-commons
        run: go test -tags=mysql -run 'TestMySQLMigrationConsistency|TestBaselineScenarios' ./migration/
        env:
          MYSQL_DSN: root:test@tcp(127.0.0.1:3306)/recruitment_test?parseTime=true
          ALLOW_INSECURE_DEV_CONFIG: "true"

  billing-image:
    name: Billing Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate all microservice image targets
        run: bash scripts/build-microservice-images.sh --check
      - name: Build Billing image
        run: |
          docker build \
            --file smart-recruit-deploy/docker/go-service.Dockerfile \
            --build-arg SERVICE_DIR=smart-recruit-billing-service \
            --build-arg CMD_PATH=./cmd/billing-service \
            --build-arg BINARY_NAME=billing-service \
            --tag smart-recruit/smart-recruit-billing-service:ci \
            .

  # ── Frontend Type Check + Build ──────────────────────────────────
  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [hr-frontend, user-frontend, platform-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm --filter ${{ matrix.app }} typecheck
      - name: Build
        run: pnpm --filter ${{ matrix.app }} build
      - name: Run tests
        run: pnpm --filter ${{ matrix.app }} test

  # ── Proto Lint ────────────────────────────────────────────────────
  # Regenerate canonical smart-recruit-proto Go contracts and require an empty diff.
  proto-lint:
    name: Proto Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache-dependency-path: |
            smart-recruit-proto/go.sum
      - name: Bootstrap pinned protobuf toolchain
        run: |
          set -euo pipefail
          tool_bin="$(smart-recruit-proto/scripts/bootstrap-tools.sh)"
          echo "$tool_bin" >> "$GITHUB_PATH"
      - name: Regenerate protobuf contracts
        run: |
          set -euo pipefail
          cd smart-recruit-proto
          ./scripts/generate-go.sh
      - name: Verify protobuf diff is empty
        run: |
          set -euo pipefail
          node scripts/check-proto-sync.mjs --check
          if ! git diff --quiet \
              smart-recruit-proto/proto/recruitment.proto \
              smart-recruit-proto/recruitment/pb/recruitment.pb.go \
              smart-recruit-proto/recruitment/pb/recruitment_grpc.pb.go; then
            echo "ERROR: proto regeneration produced changes."
            echo ""
            echo "This means the committed protobuf contracts are out of sync with the canonical proto source."
            echo "To fix locally:"
            echo "  1. cd smart-recruit-proto"
            echo "  2. ./scripts/bootstrap-tools.sh"
            echo "  3. ./scripts/generate-go.sh"
            echo "  4. Commit the generated smart-recruit-proto files"
            echo ""
            echo "Diff summary:"
            git diff --stat \
              smart-recruit-proto/proto/recruitment.proto \
              smart-recruit-proto/recruitment/pb/recruitment.pb.go \
              smart-recruit-proto/recruitment/pb/recruitment_grpc.pb.go
            exit 1
          fi
          echo "OK: protobuf regeneration matches committed contracts"

  # ── Secret Scanning ──────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
