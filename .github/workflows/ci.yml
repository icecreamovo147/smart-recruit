name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [dev, main]

jobs:
  # ── Go Backend Tests ──────────────────────────────────────────────
  go-test:
    name: Go Tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - smart-recruit-proto
          - smart-recruit-platform-go
          - smart-recruit-commons
          - smart-recruit-gateway
          - smart-recruit-identity-service
          - smart-recruit-recruitment-service
          - smart-recruit-interview-service
          - smart-recruit-offer-service
          - smart-recruit-notification-service
          - smart-recruit-ai-agent-service
          - smart-recruit-analytics-service
          - smart-recruit-worker-service
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: recruitment_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache-dependency-path: |
            smart-recruit-*/go.sum
      - name: Go tests
        working-directory: ${{ matrix.module }}
        run: go test ./...
        env:
          MYSQL_DSN: root:test@tcp(127.0.0.1:3306)/recruitment_test?parseTime=true
          ALLOW_INSECURE_DEV_CONFIG: "true"
      - name: MySQL migration consistency test
        if: matrix.module == 'smart-recruit-commons'
        working-directory: smart-recruit-commons
        run: go test -tags=mysql -run 'TestMySQLMigrationConsistency|TestBaselineScenarios' ./migration/
        env:
          MYSQL_DSN: root:test@tcp(127.0.0.1:3306)/recruitment_test?parseTime=true
          ALLOW_INSECURE_DEV_CONFIG: "true"

  # ── Frontend Type Check + Build ──────────────────────────────────
  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [hr-frontend, user-frontend, interviewer-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm --filter ${{ matrix.app }} typecheck
      - name: Build
        run: pnpm --filter ${{ matrix.app }} build
      - name: Run tests
        run: pnpm --filter ${{ matrix.app }} test

  # ── Proto Lint ────────────────────────────────────────────────────
  # Regenerate canonical smart-recruit-proto Go contracts and require an empty diff.
  proto-lint:
    name: Proto Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache-dependency-path: |
            smart-recruit-proto/go.sum
      - name: Install protoc 25.3
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget unzip
          PROTOC_VERSION=25.3
          wget -q "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip" -O /tmp/protoc.zip
          PROTOC_DIR="$HOME/.local/protoc"
          mkdir -p "$PROTOC_DIR"
          unzip -q -o /tmp/protoc.zip -d "$PROTOC_DIR"
          export PATH="$PROTOC_DIR/bin:$PATH"
          echo "$PROTOC_DIR/bin" >> "$GITHUB_PATH"
          protoc --version
      - name: Install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
      - name: Install protoc-gen-go-grpc
        run: go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: Regenerate protobuf contracts
        run: |
          set -euo pipefail
          export PATH="$PATH:$(go env GOPATH)/bin"
          cd smart-recruit-proto
          ./scripts/generate-go.sh
      - name: Verify protobuf diff is empty
        run: |
          set -euo pipefail
          node scripts/check-proto-sync.mjs --check
          if ! git diff --quiet \
              smart-recruit-proto/proto/recruitment.proto \
              smart-recruit-proto/recruitment/pb/recruitment.pb.go \
              smart-recruit-proto/recruitment/pb/recruitment_grpc.pb.go; then
            echo "ERROR: proto regeneration produced changes."
            echo ""
            echo "This means the committed protobuf contracts are out of sync with the canonical proto source."
            echo "To fix locally:"
            echo "  1. cd smart-recruit-proto"
            echo "  2. ./scripts/generate-go.sh"
            echo "  3. Commit the generated smart-recruit-proto files"
            echo ""
            echo "Diff summary:"
            git diff --stat \
              smart-recruit-proto/proto/recruitment.proto \
              smart-recruit-proto/recruitment/pb/recruitment.pb.go \
              smart-recruit-proto/recruitment/pb/recruitment_grpc.pb.go
            exit 1
          fi
          echo "OK: protobuf regeneration matches committed contracts"

  # ── Secret Scanning ──────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
