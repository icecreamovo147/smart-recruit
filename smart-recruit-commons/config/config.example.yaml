logging:
  level: "info"                      # LOG_LEVEL: debug / info / warn / error
  format: "json"                     # LOG_FORMAT: console (colored) / json (machine-readable)
  enable_file: false                 # LOG_ENABLE_FILE: enable JSON file rotation
  file_path: "logs/smart-recruit-commons.log"  # LOG_FILE_PATH: log file path
  max_size_mb: 100                   # LOG_MAX_SIZE_MB: max size per log file before rotation
  max_backups: 3                     # LOG_MAX_BACKUPS: rotated files to keep
  max_age_days: 28                   # LOG_MAX_AGE_DAYS: days to retain logs
  compress: true                     # LOG_COMPRESS: gzip rotated log files
  enable_console: true               # LOG_ENABLE_CONSOLE: colored stdout output
  gorm:
    enable_sql_log: false            # GORM_ENABLE_SQL_LOG: log all SQL statements at DEBUG level
    slow_threshold_ms: 200           # GORM_SLOW_THRESHOLD_MS: WARN on queries slower than this
    ignore_record_not_found: true    # GORM_IGNORE_NOT_FOUND: suppress gorm.ErrRecordNotFound

mysql:
  dsn: "root:CHANGE_ME_MYSQL_PASSWORD@tcp(127.0.0.1:3306)/recruitment?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai&time_zone=%27%2B08%3A00%27"
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: "1h"
  conn_max_idle_time: "10m"

oss:
  provider: "tencent_cos" # tencent_cos / aliyun_oss
  endpoint: ""
  access_key_id: ""
  access_key_secret: ""
  bucket_name: ""
  public_base_url: "http://localhost:9000"

ai:
  api_key: ""
  model: "qwen-plus"
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  agent_runtime: "adk"                 # AI_AGENT_RUNTIME: adk / legacy
  timeout: "90s"
  # Phase 2-5: high-availability AI tuning knobs.
  total_timeout: "120s"                # AI_TOTAL_TIMEOUT: end-to-end budget per conversation
  tool_max_rounds: 5                   # AI_TOOL_MAX_ROUNDS: max tool-calling rounds
  tool_total_timeout: "30s"            # AI_TOOL_TOTAL_TIMEOUT: cumulative tool execution budget
  max_concurrency: 10                  # AI_MAX_CONCURRENCY: concurrent LLM call limit (semaphore)
  circuit_failure_threshold: 5         # AI_CIRCUIT_FAILURE_THRESHOLD: consecutive failures to open
  circuit_open_timeout: "30s"          # AI_CIRCUIT_OPEN_TIMEOUT: time before half-open probe
  circuit_half_open_max_requests: 2    # AI_CIRCUIT_HALF_OPEN_MAX_REQUESTS: max concurrent probes
  retry_max_attempts: 2               # AI_RETRY_MAX_ATTEMPTS: max retries for 429/5xx/timeout
  retry_base_delay: "500ms"           # AI_RETRY_BASE_DELAY: base for exponential backoff
  slow_response_threshold: "5s"       # AI_SLOW_RESPONSE_THRESHOLD: emit timeout_warning status

jwt:
  # 本地部署时必须填写，且必须与 Web 网关使用的 JWT_SECRET 完全一致。
  # Docker / K8s 部署时通过 JWT_SECRET 环境变量注入，会覆盖此处配置。
  # 示例（请替换为实际密钥，不要提交真实值）:
  #   secret: "CHANGE_ME_JWT_SECRET_AT_LEAST_32_CHARS"
  secret: ""

grpc:
  port: 50051
  tls_cert_file: "" # GRPC_TLS_CERT_FILE: required when GRPC_INTERNAL_TLS=required
  tls_key_file: ""  # GRPC_TLS_KEY_FILE: required when GRPC_INTERNAL_TLS=required

observability:
  metrics_addr: ""        # METRICS_ADDR: optional Prometheus metrics HTTP listener, e.g. ":9091"
  worker_health_addr: ""  # WORKER_HEALTH_ADDR: worker-only /livez and /readyz listener, e.g. ":9092"

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0
  pool_size: 20
  min_idle_conns: 5
  dial_timeout: "2s"
  read_timeout: "1s"
  write_timeout: "1s"

agent:
  recent_message_limit: 20
  summary_trigger_messages: 30
  max_memory_chars: 1500
  max_prompt_chars: 20000
  max_memories: 10
  memory:
    enabled: true                       # AGENT_MEMORY_ENABLED
    write_enabled: true                 # AGENT_MEMORY_WRITE_ENABLED
    inject_enabled: true                # AGENT_MEMORY_INJECT_ENABLED
    cleanup_interval: 15m               # AGENT_MEMORY_CLEANUP_INTERVAL
    cleanup_timeout: 5m                 # AGENT_MEMORY_CLEANUP_TIMEOUT
    revoked_retention: 720h             # AGENT_MEMORY_REVOKED_RETENTION
  features:
    planner: true                       # AGENT_FEATURE_PLANNER
    structured_resume_parse: true       # AGENT_FEATURE_STRUCTURED_RESUME_PARSE
    candidate_match: true               # AGENT_FEATURE_CANDIDATE_MATCH
    skill_governance: true              # AGENT_FEATURE_SKILL_GOVERNANCE
    semantic_retrieval: true            # AGENT_FEATURE_SEMANTIC_RETRIEVAL
    mcp_policy: true                    # AGENT_FEATURE_MCP_POLICY
    fallbacks: true                     # AGENT_FEATURE_FALLBACKS
    resume_parse_timeout: "30s"         # AGENT_RESUME_PARSE_TIMEOUT
    candidate_match_timeout: "15s"      # AGENT_CANDIDATE_MATCH_TIMEOUT
    semantic_retrieval_timeout: "5s"    # AGENT_SEMANTIC_RETRIEVAL_TIMEOUT

rabbitmq:
  url: "amqp://CHANGE_ME_RABBITMQ_USER:CHANGE_ME_RABBITMQ_PASSWORD@127.0.0.1:5672/"
  exchange: "recruitment.events"
  dlx_exchange: "recruitment.events.dlx"
  retry_exchange: "recruitment.events.retry"
  notification_queue: "recruitment.notification.create"
  resume_parse_queue: "recruitment.resume.parse"
  email_queue: "recruitment.email.send"
  embedding_queue: "recruitment.embedding.upsert"
  agent_run_queue: "recruitment.agent.run.execute"
  prefetch_count: 10
  max_retries: 5
  retry_delay: "5s"
  reconnect_interval: "3s"

smtp:
  host: ""                  # SMTP_HOST: SMTP 服务器地址，留空则使用 LogSender（仅日志输出）
  port: 587                 # SMTP_PORT: SMTP 端口
  username: ""              # SMTP_USERNAME
  password: ""              # SMTP_PASSWORD
  from_address: "noreply@example.com"  # SMTP_FROM_ADDRESS
  from_name: "Smart Recruit"           # SMTP_FROM_NAME
  tls: true                 # 是否使用 TLS

mcp:
  default_timeout_seconds: 30         # MCP_DEFAULT_TIMEOUT_SECONDS
  default_max_retries: 1              # MCP_DEFAULT_MAX_RETRIES
  allow_stdio: false                  # MCP_ALLOW_STDIO
  allowed_stdio_commands:
    - npx                            # MCP_ALLOWED_STDIO_COMMANDS: comma-separated, e.g. npx,node
    - node
  allowed_url_hosts: []               # MCP_ALLOWED_URL_HOSTS: comma-separated host allowlist
  block_private_network: true         # MCP_BLOCK_PRIVATE_NETWORK
  max_timeout_seconds: 120            # MCP_MAX_TIMEOUT_SECONDS

embedding:
  enabled: true                              # EMBEDDING_ENABLED: 启用 Embedding Provider
  default_model_id: 0                        # EMBEDDING_DEFAULT_MODEL_ID: 默认 Embedding 模型 ID
  fallback_to_rule_retrieval: true           # EMBEDDING_FALLBACK_TO_RULE_RETRIEVAL: Provider 不可用时降级为规则召回
  request_timeout: "30s"                     # EMBEDDING_REQUEST_TIMEOUT: Embedding API 请求超时
  max_concurrency: 8                         # EMBEDDING_MAX_CONCURRENCY: 最大并发请求数
  slow_request_threshold: "2s"               # EMBEDDING_SLOW_REQUEST_THRESHOLD: 慢请求阈值

# TASK-FU-004：Skill / Memory 召回排序权重与阈值
# 默认值与 SDD §3.3 一致；空值 / 0 走 hardcode 默认；越界 clamp 到合法范围。
# env 覆盖：RANKING_WEIGHT_VECTOR / RANKING_BUSINESS_BOOST_MAX 等
ranking:
  weight_vector: 0.6       # RANKING_WEIGHT_VECTOR:   向量相似度权重（0..1）
  weight_lexical: 0.3      # RANKING_WEIGHT_LEXICAL:  关键词命中权重（0..1）
  weight_metadata: 0.1     # RANKING_WEIGHT_METADATA: 元数据命中权重（0..1）
  business_boost_max: 1.5  # RANKING_BUSINESS_BOOST_MAX: business_boost 上界（1.0..1.5）
  priority_norm: 50.0     # RANKING_PRIORITY_NORM:    priority 归一化分母（0.0001..10000）
  boost_alpha: 0.2        # RANKING_BOOST_ALPHA:      priority_normalized 系数（0..1）
  boost_beta: 0.2         # RANKING_BOOST_BETA:       importance_signal 系数（0..1）
  boost_gamma: 0.1        # RANKING_BOOST_GAMMA:      confidence_signal 系数（0..1）
  relevance_gate: 0.15    # RANKING_RELEVANCE_GATE:   Memory 相关性 gating 阈值（0..1）
  gap_high: 0.10          # RANKING_GAP_HIGH:        top1/top2 gap → high 阈值（0..1）
  gap_medium: 0.03        # RANKING_GAP_MEDIUM:      top1/top2 gap → medium 阈值（0..1）

frontend_base_url: "http://localhost:5173"  # FRONTEND_BASE_URL: 前端地址基础 URL
