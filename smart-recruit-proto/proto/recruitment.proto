}

message GetTenantUsageResponse {
  int32 code = 1;
  string msg = 2;
  int64 tenant_id = 3;
  repeated TenantUsageMetric metrics = 4;
}

message QuotaAlertInfo {
  int64 id = 1;
  int64 tenant_id = 2;
  string tenant_name = 3;
  string metric_key = 4;
  int32 threshold_percent = 5;
  int64 usage_value = 6;
  int64 quota_value = 7;
  string status = 8;
  int64 assignee_user_id = 9;
  string acknowledged_at = 10;
  string resolved_at = 11;
  string resolution_note = 12;
  string first_triggered_at = 13;
  string last_triggered_at = 14;
}

message ListQuotaAlertsRequest {
  int64 tenant_id = 1;
  string status = 2;
  string metric_key = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message ListQuotaAlertsResponse {
  int32 code = 1;
  string msg = 2;
  int64 total = 3;
  repeated QuotaAlertInfo list = 4;
}

message UpdateQuotaAlertRequest {
  int64 alert_id = 1;
  string status = 2;
  int64 assignee_user_id = 3;
  string resolution_note = 4;
}

message QuotaAlertResponse {
