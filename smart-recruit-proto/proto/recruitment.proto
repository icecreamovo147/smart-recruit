  rpc GetPromptVersionHistory(GetPromptVersionHistoryRequest) returns (GetPromptVersionHistoryResponse);
  rpc RollbackPromptVersion(RollbackPromptVersionRequest) returns (PromptTemplateResponse);

  // Internal gRPC (not exposed via HTTP gateway)
  rpc RenderPrompt(RenderPromptRequest) returns (RenderPromptResponse);
  rpc GetActivePromptByAgentType(GetActivePromptByAgentTypeRequest) returns (GetActivePromptByAgentTypeResponse);
}

// ── Prompt Template messages ─────────────────────────────────────────

