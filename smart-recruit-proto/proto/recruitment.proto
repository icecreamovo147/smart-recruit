  int32 page = 1;
  int32 page_size = 2;
  string agent_type = 3;       // optional filter
}

message ListPromptTemplatesResponse {
  int32 code = 1;
  string msg = 2;
  int64 total = 3;
  repeated PromptTemplateInfo list = 4;
}

message CreatePromptTemplateRequest {
  string name = 1;
  string content = 2;
  string variables_json = 3;   // JSON array string, optional
  string agent_type = 4;
  string prompt_role = 5;      // system / user, default system
