}

message UpdateTenantEntitlementOverrideRequest {
  int64 tenant_id = 1;
  string entitlement_key = 2;
  string value_type = 3;
  string value_json = 4;
  string expires_at = 5;
  string reason = 6;
}

message TenantUsageMetric {
