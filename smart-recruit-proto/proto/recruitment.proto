  string model_name = 10;
  string display_name = 11;
  int64 provider_id = 12;
  string provider_name = 13;
}

message QueryPlatformAIConfigAuditLogsRequest {
  int32 page = 1;
  int32 page_size = 2;
  string resource_type = 3;
  int64 capability_id = 4;
}

message PlatformAIConfigAuditLogInfo {
  int64 id = 1;
  int64 actor_user_id = 2;
  string action = 3;
  string resource_type = 4;
  int64 resource_id = 5;
  int64 capability_id = 6;
  int64 capability_version_id = 7;
