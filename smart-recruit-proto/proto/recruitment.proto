// ══════════════════════════════════════════════════════════════════════
// Phase P1-XX: Embedding Provider & Model Configuration
// ══════════════════════════════════════════════════════════════════════

service EmbeddingConfigService {
  rpc ListEmbeddingProviders(ListEmbeddingProvidersRequest) returns (ListEmbeddingProvidersResponse);
  rpc CreateEmbeddingProvider(CreateEmbeddingProviderRequest) returns (EmbeddingProviderResponse);
  rpc UpdateEmbeddingProvider(UpdateEmbeddingProviderRequest) returns (EmbeddingProviderResponse);
  rpc DeleteEmbeddingProvider(DeleteEmbeddingProviderRequest) returns (CommonResponse);

  rpc ListEmbeddingModels(ListEmbeddingModelsRequest) returns (ListEmbeddingModelsResponse);
  rpc CreateEmbeddingModel(CreateEmbeddingModelRequest) returns (EmbeddingModelResponse);
  rpc UpdateEmbeddingModel(UpdateEmbeddingModelRequest) returns (EmbeddingModelResponse);
  rpc SetDefaultEmbeddingModel(SetDefaultEmbeddingModelRequest) returns (CommonResponse);

  rpc TestEmbeddingModel(TestEmbeddingModelRequest) returns (TestEmbeddingModelResponse);
  rpc BackfillEmbeddings(BackfillEmbeddingsRequest) returns (BackfillEmbeddingsResponse);
}

// ── Embedding Provider messages ─────────────────────────────────────

message EmbeddingProviderInfo {
  int64 id = 1;
  string name = 2;
  string provider_type = 3;
  string endpoint = 4;
  string api_key_masked = 5;
  string extra_headers_json = 6;
  bool is_enabled = 7;
  string created_at = 8;
  string updated_at = 9;
}

message ListEmbeddingProvidersRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListEmbeddingProvidersResponse {
  int32 code = 1;
  string msg = 2;
  int64 total = 3;
  repeated EmbeddingProviderInfo list = 4;
}

message CreateEmbeddingProviderRequest {
  string name = 1;
  string provider_type = 2;
  string endpoint = 3;
  string api_key = 4;
  string extra_headers_json = 5;
}

message UpdateEmbeddingProviderRequest {
  int64 id = 1;
  string name = 2;
  string provider_type = 3;
  string endpoint = 4;
  string api_key = 5;
  string extra_headers_json = 6;
  bool is_enabled = 7;
  bool is_enabled_set = 8;
  bool extra_headers_set = 9;
}

message EmbeddingProviderResponse {
  int32 code = 1;
  string msg = 2;
  EmbeddingProviderInfo provider = 3;
}

message DeleteEmbeddingProviderRequest {
  int64 id = 1;
}

// ── Embedding Model messages ────────────────────────────────────────

message EmbeddingModelInfo {
  int64 id = 1;
  int64 provider_id = 2;
  string model_name = 3;
  string display_name = 4;
  int32 embedding_dim = 5;
  int32 input_token_limit = 6;
  int32 batch_size = 7;
  int32 timeout_seconds = 8;
  int32 max_retries = 9;
  bool is_enabled = 10;
  bool is_default = 11;
  string last_test_status = 12;
  string last_test_error = 13;
  string last_test_at = 14;
  string created_at = 15;
  string updated_at = 16;
  string provider_name = 17;
}

message ListEmbeddingModelsRequest {
  int32 page = 1;
  int32 page_size = 2;
  int64 provider_id = 3;
}

message ListEmbeddingModelsResponse {
  int32 code = 1;
  string msg = 2;
  int64 total = 3;
  repeated EmbeddingModelInfo list = 4;
}

message CreateEmbeddingModelRequest {
  int64 provider_id = 1;
  string model_name = 2;
  string display_name = 3;
  int32 embedding_dim = 4;
  int32 input_token_limit = 5;
  int32 batch_size = 6;
  int32 timeout_seconds = 7;
  int32 max_retries = 8;
  bool is_default = 9;
}

message UpdateEmbeddingModelRequest {
  int64 id = 1;
  string model_name = 2;
  string display_name = 3;
  int32 embedding_dim = 4;
  bool embedding_dim_set = 5;
  int32 input_token_limit = 6;
  bool input_token_limit_set = 7;
  int32 batch_size = 8;
  bool batch_size_set = 9;
  int32 timeout_seconds = 10;
  bool timeout_seconds_set = 11;
  int32 max_retries = 12;
  bool max_retries_set = 13;
  bool is_enabled = 14;
  bool is_enabled_set = 15;
  bool is_default = 16;
  bool is_default_set = 17;
}

message EmbeddingModelResponse {
  int32 code = 1;
  string msg = 2;
  EmbeddingModelInfo model = 3;
}

message DeleteEmbeddingModelRequest {
  int64 id = 1;
}

message SetDefaultEmbeddingModelRequest {
  int64 id = 1;
}

message TestEmbeddingModelRequest {
  int64 provider_id = 1;
  int64 model_id = 2;
  string test_text = 3;
}

message TestEmbeddingModelResponse {
  int32 code = 1;
  string msg = 2;
  bool success = 3;
  int32 dimension = 4;
  int64 latency_ms = 5;
  string request_id = 6;
  string detail = 7;
}

message BackfillEmbeddingsRequest {
  string object_type = 1;
  int32 limit = 2;
  int32 batch_size = 3;
  bool force = 4;
  bool dry_run = 5;
  int64 model_id = 6;
  int64 object_id = 7;
}

message BackfillEmbeddingsResponse {
  int32 code = 1;
  string msg = 2;
  int32 success_count = 3;
  int32 failed_count = 4;
  int32 skipped_count = 5;
}

message PreviewChatContextRequest {
  int64 hr_id = 1;
  int64 session_id = 2;
  int64 model_id = 3; // Requested model; 0 follows the current default model.
  repeated string skill_capability_keys = 4;
  repeated int64 agent_skill_ids = 5;
}

message PreviewChatContextResponse {
  int32 code = 1;
  string msg = 2;
  int64 selected_model_id = 3;
  ContextUsageInfo context_usage = 4;
}

enum BillingOwnerType {
  BILLING_OWNER_TYPE_UNSPECIFIED = 0;
  BILLING_OWNER_TYPE_TENANT = 1;
  BILLING_OWNER_TYPE_USER = 2;
}

enum BillingEnforcementMode {
  BILLING_ENFORCEMENT_MODE_UNSPECIFIED = 0;
  BILLING_ENFORCEMENT_MODE_SHADOW = 1;
  BILLING_ENFORCEMENT_MODE_ENFORCE = 2;
}

message BillingOwner {
  BillingOwnerType type = 1;
  int64 id = 2;
}

message CheckAIAccessRequest {
  BillingOwner owner = 1;
  int64 user_id = 2;
  string capability = 3;
  int64 estimated_credits = 4;
}

message CheckAIAccessResponse {
  int32 code = 1;
  string msg = 2;
  bool allowed = 3;
  string reason = 4;
  int64 available_credits = 5;
  BillingEnforcementMode enforcement_mode = 6;
  int64 capability_version_id = 7;
}

message ReserveAIUsageRequest {
  BillingOwner owner = 1;
  int64 user_id = 2;
  string capability = 3;
  string operation = 4;
  string provider_key = 5;
  string model_key = 6;
  int64 estimated_credits = 7;
  string idempotency_key = 8;
  int64 ttl_seconds = 9;
}

message ReserveAIUsageResponse {
  int32 code = 1;
  string msg = 2;
  bool allowed = 3;
  string reason = 4;
  string reservation_no = 5;
  int64 reserved_credits = 6;
  int64 available_credits = 7;
  int64 expires_at_unix_ms = 8;
  BillingEnforcementMode enforcement_mode = 9;
  int64 capability_version_id = 10;
}

message AIProviderUsage {
  int32 provider_call_seq = 1;
  string provider_key = 2;
  string model_key = 3;
  int64 input_tokens = 4;
  int64 output_tokens = 5;
  int64 cached_input_tokens = 6;
  string provider_request_id = 7;
  bool estimated = 8;
  int64 occurred_at_unix_ms = 9;
  string metadata_json = 10;
}

message SettleAIUsageRequest {
  string reservation_no = 1;
  repeated AIProviderUsage provider_usages = 2;
  string idempotency_key = 3;
}

message SettleAIUsageResponse {
  int32 code = 1;
  string msg = 2;
  int64 charged_credits = 3;
  int64 supplier_cost_micros = 4;
  int64 available_credits = 5;
  bool already_settled = 6;
}

message CancelAIUsageRequest {
  string reservation_no = 1;
  string reason = 2;
  string idempotency_key = 3;
}

message CancelAIUsageResponse {
  int32 code = 1;
  string msg = 2;
  int64 released_credits = 3;
  int64 available_credits = 4;
  bool already_cancelled = 5;
}

message GetAICreditBalanceRequest {
  BillingOwner owner = 1;
}

message GetAICreditBalanceResponse {
  int32 code = 1;
  string msg = 2;
  int64 available_credits = 3;
  int64 reserved_credits = 4;
  int64 next_expiry_at_unix_ms = 5;
  BillingEnforcementMode enforcement_mode = 6;
}

message BillingPriceInfo {
  int64 id = 1;
  int32 version = 2;
  string billing_term = 3;
  int64 amount_fen = 4;
  string currency = 5;
  int64 included_credits = 6;
  string entitlement_snapshot_json = 7;
}

message BillingProductInfo {
  int64 id = 1;
  string product_key = 2;
  string name = 3;
  string description = 4;
  string product_type = 5;
  repeated BillingPriceInfo prices = 6;
}

message ListBillingCatalogRequest { BillingOwner owner = 1; }
message ListBillingCatalogResponse {
  int32 code = 1;
  string msg = 2;
  repeated BillingProductInfo products = 3;
  string payment_environment = 4;
}

message BillingSubscriptionInfo {
  int64 id = 1;
  string product_key = 2;
  string product_name = 3;
  string status = 4;
  string term = 5;
  int64 current_period_start_unix_ms = 6;
  int64 current_period_end_unix_ms = 7;
  bool cancel_at_period_end = 8;
  // Identifies how the current plan was granted. Existing paid subscriptions
  // use "paid_subscription"; platform-assigned tenant plans use
  // "platform_plan"; candidate baseline access uses "free_tier".
  string source = 9;
  int64 included_credits = 10;
}

message GetBillingAccountRequest { BillingOwner owner = 1; }
message GetBillingAccountResponse {
  int32 code = 1;
  string msg = 2;
  BillingSubscriptionInfo subscription = 3;
  int64 available_credits = 4;
  int64 reserved_credits = 5;
  int64 next_expiry_at_unix_ms = 6;
  string payment_environment = 7;
  // Credits granted in the current active buckets before consumption.
  int64 total_credits = 8;
  // Credits already settled against the current active buckets.
  int64 used_credits = 9;
  // The next monthly entitlement refresh boundary, when applicable.
  int64 next_refresh_at_unix_ms = 10;
  // The next paid subscription period that is waiting for activation.
  BillingSubscriptionInfo scheduled_subscription = 11;
}

message BillingOrderInfo {
  string order_no = 1;
  string order_type = 2;
  string product_key = 3;
  string product_name = 4;
  int64 price_version_id = 5;
  int64 amount_fen = 6;
  string currency = 7;
  string status = 8;
  string payment_environment = 9;
  int64 expires_at_unix_ms = 10;
  int64 paid_at_unix_ms = 11;
  int64 created_at_unix_ms = 12;
}

message ListBillingOrdersRequest {
  BillingOwner owner = 1;
  int32 page = 2;
  int32 page_size = 3;
}
message ListBillingOrdersResponse {
  int32 code = 1;
  string msg = 2;
  repeated BillingOrderInfo orders = 3;
  int64 total = 4;
}

message CreateBillingOrderRequest {
  BillingOwner owner = 1;
  int64 actor_user_id = 2;
  int64 price_version_id = 3;
  string order_type = 4;
  string idempotency_key = 5;
  // When true, the service closes the owner's current unpaid order before
  // creating this order. Browsers must only set this after explicit user choice.
  bool replace_pending_order = 6;
}
message BillingOrderResponse {
  int32 code = 1;
  string msg = 2;
  BillingOrderInfo order = 3;
}

message CreateAlipayPaymentRequest {
  BillingOwner owner = 1;
  int64 actor_user_id = 2;
  string order_no = 3;
  string scene = 4;
}
message CreateAlipayPaymentResponse {
  int32 code = 1;
  string msg = 2;
  string payment_no = 3;
  string redirect_url = 4;
  string payment_environment = 5;
  bool reused = 6;
  string status = 7;
  int64 expires_at_unix_ms = 8;
}

message RequestBillingRefundRequest {
  BillingOwner owner = 1;
  int64 actor_user_id = 2;
  string order_no = 3;
  string reason = 4;
  string idempotency_key = 5;
}
message BillingRefundResponse {
  int32 code = 1;
  string msg = 2;
  string refund_no = 3;
  string status = 4;
  string review_mode = 5;
}
message BillingRefundInfo {
  string refund_no = 1;
  string order_no = 2;
  string owner_type = 3;
  int64 owner_id = 4;
  int64 amount_fen = 5;
  string status = 6;
  string review_mode = 7;
  string reason = 8;
  int64 requested_by = 9;
  int64 reviewed_by = 10;
  int64 created_at_unix_ms = 11;
  int64 reviewed_at_unix_ms = 12;
  string last_error = 13;
}
message ListBillingRefundsRequest { string status = 1; int32 page = 2; int32 page_size = 3; }
message ListBillingRefundsResponse { int32 code = 1; string msg = 2; repeated BillingRefundInfo refunds = 3; int64 total = 4; }
message ReviewBillingRefundRequest { string refund_no = 1; int64 actor_user_id = 2; string action = 3; string reason = 4; }

message AlipayNotificationField { string key = 1; string value = 2; }
message ProcessAlipayNotificationRequest { repeated AlipayNotificationField fields = 1; }
message ProcessAlipayNotificationResponse {
  int32 code = 1;
  string msg = 2;
  bool accepted = 3;
}
message ResolveAlipayReturnRequest { repeated AlipayNotificationField fields = 1; }
message ResolveAlipayReturnResponse {
  int32 code = 1;
  string msg = 2;
  string source_app = 3;
  string return_token = 4;
}
message SyncAlipayReturnRequest {
  BillingOwner owner = 1;
  int64 actor_user_id = 2;
  string return_token = 3;
}

message ListBillingAdminCatalogRequest {}
message SaveBillingPriceVersionRequest {
  int64 product_id = 1;
  int64 price_version_id = 2;
  string billing_term = 3;
  int64 amount_fen = 4;
  int64 included_credits = 5;
  string entitlement_snapshot_json = 6;
  bool publish = 7;
}

message AIRateCardInfo {
  int64 id = 1;
  string provider_key = 2;
  string model_key = 3;
  int32 version = 4;
  string currency = 5;
  int64 input_micros_per_1k_tokens = 6;
  int64 output_micros_per_1k_tokens = 7;
  int64 cached_input_micros_per_1k_tokens = 8;
  int64 credit_micros = 9;
  string status = 10;
  int64 effective_at_unix_ms = 11;
}
message ListAIRateCardsRequest {}
message ListAIRateCardsResponse { int32 code = 1; string msg = 2; repeated AIRateCardInfo rates = 3; }
message SaveAIRateCardRequest {
  string provider_key = 1;
  string model_key = 2;
  int64 input_micros_per_1k_tokens = 3;
  int64 output_micros_per_1k_tokens = 4;
  int64 cached_input_micros_per_1k_tokens = 5;
  int64 credit_micros = 6;
  bool publish = 7;
}

message DeletePlatformAICapabilityDraftRequest {
  int64 version_id = 1;
  int64 actor_user_id = 2;
  string request_id = 3;
}
