  int64 id = 1;
  string name = 2;
  string content = 3;
  string variables_json = 4;     // JSON array string
  int32 version = 5;
  bool is_active = 6;
  string agent_type = 7;
  string prompt_role = 8;
  int64 created_by = 9;
  int64 updated_by = 10;
  string created_at = 11;
