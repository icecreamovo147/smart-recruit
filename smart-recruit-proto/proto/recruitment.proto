}

message LoginResponse {
  int32 code = 1;
  string msg = 2;
  string token = 3;
  int64 user_id = 4;
  int32 role = 5;           // Deprecated: kept for migration compatibility
  string username = 6;
  string account_type = 7;  // candidate | staff | service
  repeated string roles = 8;       // RBAC role keys
  repeated string permissions = 9; // RBAC permission keys
  int32 token_version = 10;        // Incremented on permission change
  string email = 11;
  int64 tenant_id = 12;
  int64 membership_id = 13;
  string client_app = 14;
  repeated string available_apps = 15;
  repeated TenantMembershipInfo memberships = 16;
}

message RefreshTokenRequest {
  string refresh_token = 1;
  string client_ip = 2;
  string user_agent = 3;
}

message RefreshTokenResponse {
  int32 code = 1;
  string msg = 2;
  int64 user_id = 3;
  string username = 4;
  int32 role = 5;           // Deprecated: kept for migration compatibility
  string refresh_token = 6;
  int64 refresh_expires_at = 7;
  string account_type = 8;  // candidate | staff | service
  repeated string roles = 9;       // RBAC role keys
  repeated string permissions = 10; // RBAC permission keys
  int32 token_version = 11;        // Incremented on permission change
  int64 tenant_id = 12;
  int64 membership_id = 13;
  string client_app = 14;
}

message SwitchTenantRequest {
  string refresh_token = 1;
  int64 tenant_id = 2;
  string client_ip = 3;
  string user_agent = 4;
}

message RevokeRefreshTokenRequest {
  string refresh_token = 1;
}

message AuthAuditRequest {
  int64 actor_user_id = 1;
  string actor_roles = 2;
  string permission_key = 3;
  string resource_type = 4;
  uint64 resource_id = 5;
  string decision = 6;
  string reason = 7;
  string request_id = 8;
  string client_ip = 9;
  int64 tenant_id = 10;
  int64 membership_id = 11;
}

message GetPrincipalRequest {
  int64 user_id = 1;
  int64 tenant_id = 2;
  int64 membership_id = 3;
  string client_app = 4;
}

message GetPrincipalResponse {
  int32 code = 1;
  string msg = 2;
  int64 user_id = 3;
  string username = 4;
  string account_type = 5;
  int32 role = 6;                      // Deprecated: legacy numeric role
  repeated string roles = 7;           // RBAC role keys
  repeated string permissions = 8;     // RBAC permission keys
  int32 token_version = 9;
  repeated ScopeAssignment data_scopes = 10;
  string email = 11;
  int64 tenant_id = 12;
  int64 membership_id = 13;
  string client_app = 14;
  repeated string available_apps = 15;
  repeated TenantMembershipInfo memberships = 16;
}

message AuthorizeInternalRequest {
  int64 actor_user_id = 1;
  string permission_key = 2;
  string required_scope_key = 3;
  string resource_type = 4;
  int64 resource_id = 5;
  string request_id = 6;
  string client_ip = 7;
  int64 tenant_id = 8;
  int64 membership_id = 9;
  string client_app = 10;
}

message AuthorizeInternalResponse {
  int32 code = 1;
  string msg = 2;
  bool allowed = 3;
  string reason = 4;
  GetPrincipalResponse principal = 5;
  repeated ScopeAssignment matched_scopes = 6;
}

message UpdateEmailRequest {
  int64 user_id = 1;
  string email = 2;
}

