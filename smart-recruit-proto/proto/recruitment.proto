// Phase M2: Prompt Template Management
// ══════════════════════════════════════════════════════════════════════

service PromptService {
  rpc ListPromptTemplates(ListPromptTemplatesRequest) returns (ListPromptTemplatesResponse);
  rpc CreatePromptTemplate(CreatePromptTemplateRequest) returns (PromptTemplateResponse);
  rpc UpdatePromptTemplate(UpdatePromptTemplateRequest) returns (PromptTemplateResponse);
