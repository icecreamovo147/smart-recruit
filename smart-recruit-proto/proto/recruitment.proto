// ══════════════════════════════════════════════════════════════════════
// Phase M2: LLM Provider & Model Configuration
// ══════════════════════════════════════════════════════════════════════

service LlmConfigService {
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse);
  rpc CreateProvider(CreateProviderRequest) returns (ProviderResponse);
  rpc UpdateProvider(UpdateProviderRequest) returns (ProviderResponse);
  rpc DeleteProvider(DeleteProviderRequest) returns (CommonResponse);
  rpc TestProviderConnection(TestProviderConnectionRequest) returns (TestProviderConnectionResponse);
  rpc DiscoverProviderModels(DiscoverProviderModelsRequest) returns (DiscoverProviderModelsResponse);
  rpc GetProviderModelPreset(GetProviderModelPresetRequest) returns (GetProviderModelPresetResponse);

  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc CreateModel(CreateModelRequest) returns (ModelResponse);
  rpc UpdateModel(UpdateModelRequest) returns (ModelResponse);
  rpc DeleteModel(DeleteModelRequest) returns (CommonResponse);
  // TestModelConnection validates a concrete model (preferred over provider-level test).
  rpc TestModelConnection(TestModelConnectionRequest) returns (TestProviderConnectionResponse);
}

// ── LLM Provider messages ───────────────────────────────────────────

message LlmProviderInfo {
  int64 id = 1;
  string name = 2;
  string base_url = 3;
  string api_key_masked = 4;       // 脱敏后的 key（前4+后4）
  string provider_type = 5;
  string extra_headers_json = 6;   // JSON 字符串，value 已脱敏
  bool is_enabled = 7;
  string created_at = 8;
  string updated_at = 9;
  string protocol_type = 10;
  string auth_type = 11;
  string api_version = 12;
  string discovery_url = 13;
}

message ListProvidersRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListProvidersResponse {
  int32 code = 1;
  string msg = 2;
  int64 total = 3;
  repeated LlmProviderInfo list = 4;
}

message CreateProviderRequest {
  string name = 1;
  string base_url = 2;
  string api_key = 3;              // 明文传入，服务端加密存储
  string provider_type = 4;
  string extra_headers_json = 5;   // JSON string
  string protocol_type = 6;
  string auth_type = 7;
  string api_version = 8;
  string discovery_url = 9;
}

message UpdateProviderRequest {
  int64 id = 1;
  string name = 2;                 // 空 = 不更新
  string base_url = 3;             // 空 = 不更新
  string api_key = 4;              // 空 = 不更新
  string provider_type = 5;        // 空 = 不更新
  string extra_headers_json = 6;   // 空 = 不更新，extra_headers_set=true 时显式清空
  bool is_enabled = 7;
  bool is_enabled_set = 8;         // 是否设置了 is_enabled
  bool extra_headers_set = 9;      // 是否显式设置了 extra_headers_json（支持清空）
  string protocol_type = 10;
  string auth_type = 11;
  string api_version = 12;
  string discovery_url = 13;
  bool discovery_url_set = 14;
  bool api_version_set = 15;
}

message ProviderResponse {
  int32 code = 1;
  string msg = 2;
  LlmProviderInfo provider = 3;
