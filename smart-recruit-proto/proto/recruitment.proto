// ── Auth Audit Logs ───────────────────────────────────────────────────

message QueryAuthAuditLogsRequest {
  int64 actor_user_id = 1;    // optional filter
  string permission_key = 2;  // optional filter
  string decision = 3;        // optional filter: allowed / denied
  int32 page = 4;
  int32 page_size = 5;
}

message AuthAuditLogItem {
  uint64 id = 1;
  int64 actor_user_id = 2;
  string actor_roles = 3;
  string permission_key = 4;
  string resource_type = 5;
  uint64 resource_id = 6;
  string decision = 7;
  string reason = 8;
  string request_id = 9;
  string client_ip = 10;
  string created_at = 11;
}

message QueryAuthAuditLogsResponse {
  int32 code = 1;
  string msg = 2;
  int64 total = 3;
  repeated AuthAuditLogItem list = 4;
}

// ── Dashboard Report ─────────────────────────────────────────────────

message GetDashboardReportRequest {
  int64 staff_user_id = 1;
}

message DashboardReportItem {
  string stage_key = 1;
  string stage_label = 2;
  int64 count = 3;
}

message DashboardTrendPoint {
  string date = 1;
  int64 applications = 2;
}

message GetDashboardReportResponse {
  int32 code = 1;
  string msg = 2;

  // KPI
  int64 online_jobs = 3;
  int64 offline_jobs = 4;
  int64 total_applications = 5;
  int64 today_applications = 6;
  int64 unread_notifications = 7;
  int64 pending_actions = 8;

  // Trend (last 7 days)
  repeated DashboardTrendPoint trend = 9;

  // Stage distribution (funnel)
  repeated DashboardReportItem stage_distribution = 10;
}

// ── Funnel Report ────────────────────────────────────────────────────

message GetFunnelReportRequest {
  int64 staff_user_id = 1;
  string start_date = 2;  // RFC 3339, optional
  string end_date = 3;    // RFC 3339, optional
  int64 job_id = 4;       // optional filter
}

message FunnelStage {
  string stage_key = 1;
  string stage_label = 2;
  int64 count = 3;
  double conversion_rate = 4; // rate from previous stage (0-100)
}

message GetFunnelReportResponse {
  int32 code = 1;
  string msg = 2;
  repeated FunnelStage stages = 3;
}

// ── Time-in-Stage Report ─────────────────────────────────────────────

message GetTimeInStageReportRequest {
  int64 staff_user_id = 1;
  string start_date = 2;  // RFC 3339, optional
  string end_date = 3;    // RFC 3339, optional
  int64 job_id = 4;       // optional filter
}

message StageDuration {
  string stage_key = 1;
  string stage_label = 2;
  double avg_hours = 3;    // average hours spent in this stage
  int64 transition_count = 4;
}

message GetTimeInStageReportResponse {
  int32 code = 1;
  string msg = 2;
  repeated StageDuration durations = 3;
}

// ── Interview & Offer Metrics ────────────────────────────────────────

message GetInterviewOfferMetricsRequest {
  int64 staff_user_id = 1;
  string start_date = 2;  // RFC 3339, optional
  string end_date = 3;    // RFC 3339, optional
  int64 job_id = 4;       // optional filter
}

message GetInterviewOfferMetricsResponse {
  int32 code = 1;
  string msg = 2;

  // Interview metrics
  int64 total_interviews = 3;
  int64 completed_interviews = 4;
  int64 positive_feedbacks = 5;
  double pass_rate = 6;  // 0-100

  // Offer metrics
  int64 total_offers = 7;
  int64 accepted_offers = 8;
  int64 rejected_offers = 9;
  double acceptance_rate = 10; // 0-100
}

// ══════════════════════════════════════════════════════════════════════
// P1-003: AI Usage Statistics & Trend
// ══════════════════════════════════════════════════════════════════════

message GetUsageStatsRequest {
  string start_time = 1;   // RFC 3339
  string end_time = 2;     // RFC 3339
  // user / model / session / provider / service_type
  string dimension = 3;
}

message UsageStatsItem {
  string name = 1;                // dimension value: user_id, model, session, provider, or service_type
  int64 total_tokens = 2;         // total estimated tokens
  int64 call_count = 3;           // total call count
  double avg_cost_ms = 4;         // average cost in milliseconds
  double estimated_cost = 5;      // estimated cost in USD
  int64 success_count = 6;        // status = ok
  int64 failed_count = 7;         // status != ok
}

// Period-level totals independent of the selected dimension.
message UsageStatsSummary {
  int64 total_tokens = 1;
  int64 call_count = 2;
  int64 success_count = 3;
  int64 failed_count = 4;
  double avg_cost_ms = 5;
  double estimated_cost = 6;
  double success_rate = 7; // 0-100
}

message GetUsageStatsResponse {
  int32 code = 1;
  string msg = 2;
  repeated UsageStatsItem list = 3;
  UsageStatsSummary summary = 4;
}

message GetUsageTrendRequest {
  string start_time = 1;   // RFC 3339
  string end_time = 2;     // RFC 3339
  string granularity = 3;  // day / week / month
}

message UsageTrendPoint {
  string date = 1;                // date label (e.g. "2026-06-01")
  int64 total_tokens = 2;         // total estimated tokens
  int64 call_count = 3;           // total call count
  double avg_cost_ms = 4;         // average cost in milliseconds
  double estimated_cost = 5;      // estimated cost in USD
}

message GetUsageTrendResponse {
  int32 code = 1;
  string msg = 2;
  repeated UsageTrendPoint list = 3;
}

// ══════════════════════════════════════════════════════════════════════
// P1-006: MCP Tool Center
// ══════════════════════════════════════════════════════════════════════

// Platform-owned AI capability releases and runtime model pools. Technical
// configuration CRUD remains in the existing focused services; this service
// governs immutable release snapshots and the safe model list exposed to HR
// and candidate assistants.
service PlatformAIControlPlaneService {
  rpc ListPlatformAICapabilities(ListPlatformAICapabilitiesRequest) returns (ListPlatformAICapabilitiesResponse);
  rpc ListPlatformAICapabilityVersions(ListPlatformAICapabilityVersionsRequest) returns (ListPlatformAICapabilityVersionsResponse);
  rpc CreatePlatformAICapabilityDraft(CreatePlatformAICapabilityDraftRequest) returns (PlatformAICapabilityVersionResponse);
  rpc UpdatePlatformAICapabilityDraft(UpdatePlatformAICapabilityDraftRequest) returns (PlatformAICapabilityVersionResponse);
  rpc DeletePlatformAICapabilityDraft(DeletePlatformAICapabilityDraftRequest) returns (CommonResponse);
  rpc PublishPlatformAICapabilityVersion(PublishPlatformAICapabilityVersionRequest) returns (PlatformAICapabilityVersionResponse);
  rpc ListPlatformAIRuntimeModels(ListPlatformAIRuntimeModelsRequest) returns (ListPlatformAIRuntimeModelsResponse);
  rpc ResolvePlatformAIRuntimeModel(ResolvePlatformAIRuntimeModelRequest) returns (ResolvePlatformAIRuntimeModelResponse);
  rpc QueryPlatformAIConfigAuditLogs(QueryPlatformAIConfigAuditLogsRequest) returns (QueryPlatformAIConfigAuditLogsResponse);
}

message PlatformAICapabilityInfo {
  int64 id = 1;
  string capability_key = 2;
  string audience = 3;
  string name = 4;
  string description = 5;
  string status = 6;
  int64 current_published_version_id = 7;
}

message PlatformAICapabilityVersionInfo {
  int64 id = 1;
  int64 capability_id = 2;
  int32 version = 3;
  string status = 4;
  string snapshot_json = 5;
  string snapshot_hash = 6;
  string change_note = 7;
  string published_at = 8;
}

message ListPlatformAICapabilitiesRequest {}

message ListPlatformAICapabilitiesResponse {
  int32 code = 1;
  string msg = 2;
  repeated PlatformAICapabilityInfo list = 3;
}

message ListPlatformAICapabilityVersionsRequest {
  int64 capability_id = 1;
}

message ListPlatformAICapabilityVersionsResponse {
  int32 code = 1;
  string msg = 2;
  repeated PlatformAICapabilityVersionInfo list = 3;
}

message CreatePlatformAICapabilityDraftRequest {
  int64 capability_id = 1;
  string snapshot_json = 2;
  string change_note = 3;
  int64 actor_user_id = 4;
  string request_id = 5;
}

message UpdatePlatformAICapabilityDraftRequest {
  int64 version_id = 1;
  string snapshot_json = 2;
  string change_note = 3;
  int64 actor_user_id = 4;
  string request_id = 5;
}

message PublishPlatformAICapabilityVersionRequest {
  int64 version_id = 1;
  int64 actor_user_id = 2;
  string request_id = 3;
}

message PlatformAICapabilityVersionResponse {
  int32 code = 1;
  string msg = 2;
  PlatformAICapabilityVersionInfo version = 3;
}

message PlatformAIRuntimeModelInfo {
  int64 id = 1;
  string model_name = 2;
  string display_name = 3;
  int64 provider_id = 4;
  string provider_name = 5;
  bool is_default = 6;
  int32 max_tokens = 7;
  int32 context_window_tokens = 8;
}

message ListPlatformAIRuntimeModelsRequest {
  string capability_key = 1;
  string audience = 2;
  int64 capability_version_id = 3;
}

message ListPlatformAIRuntimeModelsResponse {
  int32 code = 1;
  string msg = 2;
  int64 capability_version_id = 3;
  string snapshot_hash = 4;
  repeated PlatformAIRuntimeModelInfo list = 5;
}

message ResolvePlatformAIRuntimeModelRequest {
  string capability_key = 1;
  string audience = 2;
  int64 capability_version_id = 3;
  int64 requested_model_id = 4;
}

message ResolvePlatformAIRuntimeModelResponse {
  int32 code = 1;
  string msg = 2;
  string capability_key = 3;
  string audience = 4;
  int64 capability_version_id = 5;
  string snapshot_hash = 6;
  int64 requested_model_id = 7;
