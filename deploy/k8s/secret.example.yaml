apiVersion: v1
kind: Secret
metadata:
  name: recruitment-secrets
  namespace: recruitment
type: Opaque
stringData:
  MYSQL_DSN: "root:CHANGE_ME_MYSQL_PASSWORD@tcp(mysql:3306)/recruitment?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai&time_zone=%27%2B08%3A00%27"
  JWT_SECRET: "CHANGE_ME_JWT_SECRET_AT_LEAST_32_CHARS"
  ENCRYPTION_KEY: "CHANGE_ME_64_HEX_CHARS_ENCRYPTION_KEY"
  AI_API_KEY: "CHANGE_ME_AI_API_KEY"
  OSS_ACCESS_KEY_ID: "CHANGE_ME_OSS_ACCESS_KEY_ID"
  OSS_ACCESS_KEY_SECRET: "CHANGE_ME_OSS_ACCESS_KEY_SECRET"
  REDIS_PASSWORD: ""
  RABBITMQ_URL: "amqp://CHANGE_ME_RABBITMQ_USER:CHANGE_ME_RABBITMQ_PASSWORD@rabbitmq:5672/"
  GRPC_INTERNAL_TOKEN: "CHANGE_ME_GRPC_INTERNAL_TOKEN_32_CHARS"
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: recruitment-grpc-tls
  namespace: recruitment
type: Opaque
stringData:
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    CHANGE_ME_GRPC_INTERNAL_CA_CERT
    -----END CERTIFICATE-----
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    CHANGE_ME_LOGIC_GRPC_SERVER_CERT
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    CHANGE_ME_LOGIC_GRPC_SERVER_PRIVATE_KEY
    -----END PRIVATE KEY-----

# ============================================================
# 安全警告：此文件仅供示例，所有值均为占位符。
# 生产部署前必须替换所有 CHANGE_ME 和空密码为强密钥。
# JWT_SECRET 必须 >= 32 字符随机字符串。
# ENCRYPTION_KEY 必须为 64 个十六进制字符。
# gRPC 内部通信生产环境必须配置 GRPC_INTERNAL_TOKEN 和 recruitment-grpc-tls。
# RABBITMQ_URL 不允许使用 guest:guest 默认凭证。
# 切勿将包含真实值的 secret.yaml 提交到版本控制。
# ============================================================
# Do NOT commit this file with real values. Copy to secret.yaml and fill in.
